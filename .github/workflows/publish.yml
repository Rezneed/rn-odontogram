name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # npm >= 11.5.1 (trusted publishing) ships with Node 24
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: corepack enable

      - run: yarn install --immutable

      - run: yarn check

      - run: yarn test

      - name: Release tag must match package.json version
        id: version
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ "${{ github.event.release.tag_name }}" != "v$version" ]; then
            echo "release tag ${{ github.event.release.tag_name }} does not match package.json v$version"
            exit 1
          fi
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm — nothing to publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.published != 'true'
        run: yarn pack --out package.tgz

      - if: steps.version.outputs.published != 'true'
        run: npm publish package.tgz
